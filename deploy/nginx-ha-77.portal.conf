worker_processes auto;
events { worker_connections 4096; }
http {
  # SRGH_IT private TLS
  ssl_certificate /etc/nginx/tls/sarangmc.crt;
  ssl_certificate_key /etc/nginx/tls/sarangmc.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SRGHSSL:10m;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  proxy_connect_timeout 2s;
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 2;
  client_max_body_size 55m;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map "$uri:$http_accept" $portal_html_navigation {
    default 0;
    "~^/(work|worklog|management|notion|register|server|account|vendor|install|rental)(/[^:]*)?:.*text/html" 1;
  }
  map "$portal_html_navigation:$arg_it_embed" $portal_direct_navigation {
    default 0;
    "~^1:(?!1$)" 1;
  }
  # BEGIN NMS HA upstream
  upstream nms_ha { server 192.168.1.77:3023 max_fails=1 fail_timeout=5s; server 192.168.1.78:3023 backup; keepalive 16; }
  # END NMS HA upstream
  upstream grafana_ha { server 192.168.1.77:3020 max_fails=1 fail_timeout=5s; server 192.168.1.78:3020 backup; keepalive 16; }
  upstream prometheus_ha { server 192.168.1.77:9090 max_fails=1 fail_timeout=5s; server 192.168.1.78:9090 backup; keepalive 16; }
  server {
    listen 3021;
    server_name _;
    location = /monitoring { return 301 /monitoring/; }
    location /monitoring/ { proxy_pass http://grafana_ha; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Prefix /monitoring; }
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location ^~ /actuator/ { return 404; }
    location = /grafana { return 301 http://sarangmc.kr/monitoring/; }
    location /grafana/ { return 301 http://sarangmc.kr/monitoring/; }
    location /prometheus/ { proxy_pass http://prometheus_ha; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { return 404; }
  }
  upstream accesslog_local { server 192.168.1.77:13006 max_fails=1 fail_timeout=5s; server 192.168.1.78:13006 backup; keepalive 16; }
  upstream worklog_local { server 192.168.1.77:13007 max_fails=1 fail_timeout=5s; server 192.168.1.78:13007 backup; keepalive 16; }
  upstream work_ui_local { server 192.168.1.77:13000 max_fails=1 fail_timeout=5s; server 192.168.1.78:13000 backup; keepalive 16; }
  upstream work_api_local { server 192.168.1.77:18000 max_fails=1 fail_timeout=5s; server 192.168.1.78:18000 backup; keepalive 16; }
  upstream management_ui_local { server 192.168.1.77:13101 max_fails=1 fail_timeout=5s; server 192.168.1.78:13101 backup; keepalive 16; }
  upstream management_api_local { server 192.168.1.77:18101 max_fails=1 fail_timeout=5s; server 192.168.1.78:18101 backup; keepalive 16; }
  upstream ip_management_local { server 192.168.1.77:3012 max_fails=1 fail_timeout=5s; server 192.168.1.78:3012 backup; keepalive 16; }
  upstream extension_local { server 192.168.1.77:3014 max_fails=1 fail_timeout=5s; server 192.168.1.78:3014 backup; keepalive 16; }
  upstream nev_local { server 192.168.1.77:13013 max_fails=1 fail_timeout=5s; server 192.168.1.78:13013 backup; keepalive 16; }
  upstream server_list_local { server 192.168.1.77:3016 max_fails=1 fail_timeout=5s; server 192.168.1.78:3016 backup; keepalive 16; }
  upstream account_list_local { server 192.168.1.77:13011 max_fails=1 fail_timeout=5s; server 192.168.1.78:13011 backup; keepalive 16; }
  upstream vendor_local { server 192.168.1.77:3017 max_fails=1 fail_timeout=5s; server 192.168.1.78:3017 backup; keepalive 16; }
  upstream rental_local { server 192.168.1.77:3018 max_fails=1 fail_timeout=5s; server 192.168.1.78:3018 backup; keepalive 16; }
  upstream install_local { server 192.168.1.77:3019 max_fails=1 fail_timeout=5s; server 192.168.1.78:3019 backup; keepalive 16; }
  upstream notion_local { server 192.168.1.77:3024 max_fails=1 fail_timeout=5s; server 192.168.1.78:3024 backup; keepalive 16; }
  upstream rad_ui_local { server 192.168.1.77:13102 max_fails=1 fail_timeout=5s; server 192.168.1.78:13102 backup; keepalive 16; }
  upstream rad_api_local { server 192.168.1.77:18102 max_fails=1 fail_timeout=5s; server 192.168.1.78:18102 backup; keepalive 16; }
  upstream qps_ui_local { server 192.168.1.77:13103 max_fails=1 fail_timeout=5s; server 192.168.1.78:13103 backup; keepalive 16; }
  upstream qps_api_local { server 192.168.1.77:18103 max_fails=1 fail_timeout=5s; server 192.168.1.78:18103 backup; keepalive 16; }
  upstream insa_ui_local { server 192.168.1.77:13104 max_fails=1 fail_timeout=5s; server 192.168.1.78:13104 backup; keepalive 16; }
  upstream insa_api_local { server 192.168.1.77:18104 max_fails=1 fail_timeout=5s; server 192.168.1.78:18104 backup; keepalive 16; }
  upstream notice_ui_local { server 192.168.1.77:13110 max_fails=1 fail_timeout=5s; server 192.168.1.78:13110 backup; keepalive 16; }
  upstream notice_api_local { server 192.168.1.77:18110 max_fails=1 fail_timeout=5s; server 192.168.1.78:18110 backup; keepalive 16; }
  upstream history_ui_local { server 192.168.1.77:13105 max_fails=1 fail_timeout=5s; server 192.168.1.78:13105 backup; keepalive 16; }
  upstream home_local { server 192.168.1.77:13008 max_fails=1 fail_timeout=5s; server 192.168.1.78:13008 backup; keepalive 16; }
  upstream gitea_ha {server 192.168.1.77:3015 max_fails=1 fail_timeout=5s; server 192.168.1.78:3015 backup; keepalive 16; }

  server {
    listen 80 default_server;
    server_name _;
    location / {
      return 444;
    }
  }

  server {
    listen 3001; server_name _;
    location = / { return 302 "http://sarangmc.kr/it/#next=/management/"; }
    location ^~ /management/static/ { return 403; }
    location /management/ { return 302 "http://sarangmc.kr/it/#next=$request_uri"; }
    location /management-api/ { return 401; }
    location = /ip { return 301 /ip/; }
    location = /ipcheck { proxy_pass http://ip_management_local/ip/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
    location = /ipcheck/ { proxy_pass http://ip_management_local/ip/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
    location /ip/ { proxy_pass http://ip_management_local/ip/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; }
    location = /extension { return 301 /extension/; }
    location /extension/ { proxy_pass http://extension_local/extension/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; proxy_set_header Connection ""; }
    location / { return 302 "http://sarangmc.kr/it/#next=/management/"; }
  }
  server {
    listen 3013; server_name _;
    location = / { return 302 /it/; }
    location /it/ { proxy_pass http://nev_local/it/; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  }
  server {
    listen 3002; server_name _;
    location = / { return 302 /rad/; }
    location /rad/ { proxy_pass http://rad_ui_local/; proxy_set_header Host $http_host; proxy_intercept_errors on; error_page 404 = /rad/; }
    location /rad-api/ { proxy_pass http://rad_api_local/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
  }
  server {
    listen 3003; server_name _;
    location = / { return 302 /qps/; }
    location /qps/ { proxy_pass http://qps_ui_local/; proxy_set_header Host $http_host; proxy_intercept_errors on; error_page 404 = /qps/; }
    location /qps-api/ { proxy_pass http://qps_api_local/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
  }
  server {
    listen 3004; server_name _;
    location = / { return 302 /insa/; }
    location /insa/ { proxy_pass http://insa_ui_local/; proxy_set_header Host $http_host; proxy_intercept_errors on; error_page 404 = /insa/; }
    location /insa-api/ { proxy_pass http://insa_api_local/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
  }
  server {
    listen 3010; server_name _;
    location = / { return 302 /notice; }
    location = /notice { proxy_pass http://notice_ui_local; proxy_set_header Host $http_host; }
    location /notice/ { proxy_pass http://notice_ui_local; proxy_set_header Host $http_host; }
    location /notice-api/ { proxy_pass http://notice_api_local/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
  }
  server {
    listen 3005; server_name _;
    location / { proxy_pass http://history_ui_local/; proxy_set_header Host $http_host; }
  }

  server {
    # domain virtual hosts on port 80
    listen 80;
    listen 443 ssl;
    listen 3006;
    server_name sarangmc.accesslog.com;
    location = / { return 302 "http://sarangmc.kr/it/#next=/register/"; }
    location = /register { return 302 "http://sarangmc.kr/it/#next=/register/"; }
    location /register/ { return 302 "http://sarangmc.kr/it/#next=$request_uri"; }
    location / { return 302 "http://sarangmc.kr/it/#next=/register$request_uri"; }
  }
  server {
    listen 80;
    listen 443 ssl;
    listen 3007;
    server_name sarangmc.worklog.com;
    location = / { return 302 "http://sarangmc.kr/it/#next=/worklog/"; }
    location /api/ { return 401; }
    location /assets/ { return 403; }
    location /worklog/ { return 302 "http://sarangmc.kr/it/#next=$request_uri"; }
    location / { return 302 "http://sarangmc.kr/it/#next=/worklog$request_uri"; }
  }
  server {
    listen 3008;
    server_name _;
    location / {
      proxy_pass http://home_local;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 3000;
    server_name _;
    location /work-api/ { return 401; }
    location = / { return 302 "http://sarangmc.kr/it/#next=/work/"; }
    location /work/ { return 302 "http://sarangmc.kr/it/#next=$request_uri"; }
    location / { return 302 "http://sarangmc.kr/it/#next=/work$request_uri"; }
  }

  # SRGH_IT sarangmc.kr path gateway
  server {
    listen 80;
    listen 443 ssl;
    server_name sarangmc.kr;
    if ($portal_direct_navigation) { return 302 "/it/#next=$request_uri"; }

    # BEGIN NMS path gateway
    location = /nms { return 301 https://sarangmc.kr/nms/; }
    location ^~ /nms/ {
      if ($scheme = http) { return 301 https://sarangmc.kr$request_uri; }
      proxy_pass http://nms_ha;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      client_max_body_size 64k;
      proxy_cache off;
      proxy_read_timeout 60s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
    # END NMS path gateway


    location = /gitea {
      return 301 http://sarangmc.kr/gitea/;
    }

    location ^~ /gitea/ {
      client_max_body_size 512m;

      rewrite ^ $request_uri;
      rewrite ^/gitea/(.*) /$1 break;
      proxy_pass http://gitea_ha$uri;

      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_connect_timeout 2s;
      proxy_read_timeout 300s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }


    location = /monitoring { return 301 /monitoring/; }
    location /monitoring/ { proxy_pass http://grafana_ha; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Prefix /monitoring; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }


    location = /extension { return 301 /extension/; }
    location /extension/ { proxy_pass http://extension_local/extension/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; proxy_set_header Connection ""; }

    location = / {
      proxy_pass http://home_local/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /_next/ { proxy_pass http://home_local; proxy_set_header Host $http_host; }
    location = /favicon.svg { proxy_pass http://home_local/favicon.svg; proxy_set_header Host $http_host; }
    location = /api/portal-systems {
      proxy_pass http://home_local/api/portal-systems;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /management { return 301 /management/$is_args$args; }
    location ^~ /management/static/ { auth_request /_srgh_it_auth; proxy_pass http://management_ui_local/static/; add_header Cache-Control "private, no-store" always; }
    location /management/ { auth_request /_srgh_it_auth; proxy_pass http://management_ui_local/; proxy_set_header Host $http_host; proxy_intercept_errors on; error_page 404 = /management/; }
    location /management-api/ { auth_request /_srgh_it_auth; proxy_pass http://management_api_local/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
    location = /rad { return 301 /rad/; }
    location = /ip { return 301 /ip/; }
    location = /ipcheck { proxy_pass http://ip_management_local/ip/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
    location = /ipcheck/ { proxy_pass http://ip_management_local/ip/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
    location /ip/ { proxy_pass http://ip_management_local/ip/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; }
    location = /it { return 301 /it/; }
    location /it/ { proxy_pass http://nev_local/it/; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /_srgh_it_auth {
      internal;
      proxy_pass http://nev_local/it/api/auth/me;
      proxy_method GET;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Accept application/json;
    }
    location = /server { return 301 /server/$is_args$args; }
    location /server/ { auth_request /_srgh_it_auth; proxy_pass http://server_list_local/server/; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /account { return 301 /account/$is_args$args; }
    location /account/ { auth_request /_srgh_it_auth; proxy_pass http://account_list_local/account/; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; add_header Cache-Control "no-store" always; }
    location = /vendor { return 301 /vendor/$is_args$args; }
    location /vendor/ { auth_request /_srgh_it_auth; proxy_pass http://vendor_local/vendor/; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; add_header Cache-Control "no-store" always; }
    location = /rental { return 301 /rental/$is_args$args; }
    location /rental/ { auth_request /_srgh_it_auth; proxy_pass http://rental_local/rental/; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; add_header Cache-Control "no-store" always; }
    location = /install { return 301 /install/$is_args$args; }
    location /install/ { auth_request /_srgh_it_auth; proxy_pass http://install_local/install/; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; add_header Cache-Control "no-store" always; }
    location = /notion { return 301 /notion/$is_args$args; }
    location /notion/api/events { auth_request /_srgh_it_auth; proxy_pass http://notion_local/notion/api/events; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 1800s; }
    location /notion/ { auth_request /_srgh_it_auth; proxy_pass http://notion_local/notion/; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; client_max_body_size 21m; add_header Cache-Control "no-store" always; }
    location /rad/ { proxy_pass http://rad_ui_local/; proxy_set_header Host $http_host; proxy_intercept_errors on; error_page 404 = /rad/; }
    location /rad-api/ { proxy_pass http://rad_api_local/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
    location = /qps { return 301 /qps/; }
    location /qps/ { proxy_pass http://qps_ui_local/; proxy_set_header Host $http_host; proxy_intercept_errors on; error_page 404 = /qps/; }
    location /qps-api/ { proxy_pass http://qps_api_local/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
    location = /insa { return 301 /insa/; }
    location /insa/ { proxy_pass http://insa_ui_local/; proxy_set_header Host $http_host; proxy_intercept_errors on; error_page 404 = /insa/; }
    location /insa-api/ { proxy_pass http://insa_api_local/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
    location = /notice { proxy_pass http://notice_ui_local; proxy_set_header Host $http_host; }
    location /notice/ { proxy_pass http://notice_ui_local; proxy_set_header Host $http_host; }
    location /notice-api/ { proxy_pass http://notice_api_local/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
    location = /work { return 301 /work/$is_args$args; }
    location /work/ { auth_request /_srgh_it_auth; proxy_pass http://work_ui_local/; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /work-api/ { auth_request /_srgh_it_auth; proxy_pass http://work_api_local/; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 120s; }

    location = /history { return 301 /history/; }
    location /history/ { proxy_pass http://history_ui_local/; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    location = /accesslog { return 301 /register/; }
    location ^~ /accesslog/ { rewrite ^/accesslog/(.*)$ /register/$1 permanent; }
    location = /register { return 301 /register/$is_args$args; }
    location /register/ {
      auth_request /_srgh_it_auth;
      proxy_pass http://accesslog_local;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_connect_timeout 3s;
      proxy_read_timeout 120s;
    }

    location = /worklog { return 301 /worklog/$is_args$args; }
    location /worklog/ {
      auth_request /_srgh_it_auth;
      proxy_pass http://worklog_local/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_connect_timeout 3s;
      proxy_read_timeout 120s;
    }
    location = /admin {
      auth_request /_srgh_it_auth;
      proxy_pass http://worklog_local/admin;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /admin/ {
      auth_request /_srgh_it_auth;
      proxy_pass http://worklog_local/admin/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /assets/ { auth_request /_srgh_it_auth; proxy_set_header Host $http_host; proxy_pass http://worklog_local/assets/; }
    location /api/ {
      auth_request /_srgh_it_auth;
      proxy_pass http://worklog_local/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
    location = /SRGH_logo.ico { proxy_set_header Host $http_host; proxy_pass http://worklog_local/SRGH_logo.ico; }
  }
}
